name: Price Monitor

on:
  schedule:
    # Every 6 hours at :15 past the hour
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB write)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run price scraper
        run: node scripts/price-scraper.cjs

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Price monitor completed successfully"
          else
            echo "❌ Price monitor failed"
          fi
